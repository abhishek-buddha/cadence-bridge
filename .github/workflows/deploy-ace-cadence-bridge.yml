name: Deploy Ace Cadence Bridge

on:
  workflow_dispatch:
  push:
    branches: [ace-cadence-bridge]
    paths:
      - "server.js"
      - "package*.json"
      - "Dockerfile"
      - "docker-compose.aws.yml"
      - ".env.aws.example"
      - "ACE_CADENCE_DEPLOY.md"
      - ".github/workflows/deploy-ace-cadence-bridge.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy bridge to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/ec2-user/cadence/cadence-bridge
            REPO=https://github.com/abhishek-buddha/cadence-bridge.git
            BRANCH=ace-cadence-bridge

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone -b "$BRANCH" "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            test -f .env || (echo "Missing $APP_DIR/.env" && exit 1)
            docker network inspect ace-cadence_default >/dev/null
            docker compose -f docker-compose.aws.yml up -d --build

            # Wait for the app to come up instead of probing it immediately.
            #
            # `docker compose up` returns as soon as the container is *started*,
            # not once Node is listening, so a bare health check raced the boot
            # and lost: every deploy since 2026-08-13 reported failure with
            # "wget: can't connect to remote host (127.0.0.1): Connection
            # refused" roughly 0.1s after "Container cadence-bridge Started" --
            # while having deployed perfectly well. A permanently red badge
            # means nobody notices the run that actually breaks.
            #
            # On genuine failure, dump the container log: "connection refused"
            # on its own says nothing about why the process did not start.
            for i in $(seq 1 15); do
              if docker exec cadence-bridge wget -qO- http://127.0.0.1:3001/health; then
                echo "bridge healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 2
            done
            echo "bridge did not become healthy within 30s"
            docker logs --tail 50 cadence-bridge
            exit 1
